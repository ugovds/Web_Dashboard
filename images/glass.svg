<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtre de diffusion volumique douce -->
    <filter id="crystalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Dégradé de fond neutre graphite / studio spatial Apple -->
    <radialGradient id="neutralStudioBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e222d" stop-opacity="1" />
      <stop offset="45%" stop-color="#12141c" stop-opacity="1" />
      <stop offset="80%" stop-color="#090a0f" stop-opacity="1" />
      <stop offset="100%" stop-color="#050608" stop-opacity="1" />
    </radialGradient>

    <!-- Corps liquide du verre transparent (Crystal Pur) -->
    <radialGradient id="liquidCrystalBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#cbd5e1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#475569" stop-opacity="0.12" />
      <stop offset="85%" stop-color="#1e293b" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.55" />
    </radialGradient>

    <!-- Cœur optique et réfraction interne -->
    <radialGradient id="crystalCore" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50" />
      <stop offset="30%" stop-color="#e2e8f0" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Arc spéculaire supérieur (Lumière zénithale Apple) -->
    <linearGradient id="specularArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Biseau de pourtour cristallin (Réfraction de la tranche) -->
    <linearGradient id="crystalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="35%" stop-color="#94a3b8" stop-opacity="0.40" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.35" />
    </linearGradient>

    <!-- Caustique inférieure (Rebond de lumière argentée) -->
    <linearGradient id="causticSilver" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ombre de contact douce -->
    <radialGradient id="contactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.70" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fond Studio Neutre -->
  <rect width="512" height="512" fill="url(#neutralStudioBg)" />

  <!-- Lueur diffuse ambiante blanche/argentée -->
  <ellipse cx="256" cy="450" rx="190" ry="45" fill="url(#contactShadow)" />
  <circle cx="210" cy="180" r="160" fill="#ffffff" opacity="0.08" filter="url(#crystalGlow)" />
  <circle cx="310" cy="300" r="140" fill="#cbd5e1" opacity="0.06" filter="url(#crystalGlow)" />

  <!-- Corps de la bulle de verre liquide (Squircle Apple) -->
  <g id="pureLiquidGlass">
    <!-- Base transparente -->
    <rect x="66" y="66" width="380" height="380" rx="114" ry="114" fill="url(#liquidCrystalBody)" />

    <!-- Ondulations de fluide intérieur neutre -->
    <path d="M170,130 C230,105 285,145 315,200 C330,250 280,310 215,305 C155,300 135,170 170,130 Z" fill="#ffffff" opacity="0.06" filter="url(#softBlur)" />
    <circle cx="320" cy="270" r="85" fill="#f8fafc" opacity="0.05" filter="url(#softBlur)" />

    <!-- Cœur de diffusion cristallin -->
    <rect x="80" y="80" width="352" height="352" rx="100" ry="100" fill="url(#crystalCore)" />

    <!-- Biseau d'arête de verre découpé au diamant -->
    <rect x="68" y="68" width="376" height="376" rx="112" ry="112" fill="none" stroke="url(#crystalRim)" stroke-width="2" opacity="0.75" />

    <!-- Caustique inférieure blanche -->
    <path d="M 120,400 C 180,435 332,435 392,400 C 352,420 220,422 120,400 Z" fill="url(#causticSilver)" />

    <!-- Arc spéculaire principal haut-gauche -->
    <path d="M 95,160 C 105,105 150,85 205,78 C 290,68 360,85 410,130 C 375,108 315,92 235,96 C 165,100 120,125 95,160 Z" fill="url(#specularArc)" />
    <ellipse cx="195" cy="125" rx="85" ry="28" transform="rotate(-20, 195, 125)" fill="url(#specularArc)" opacity="0.7" />

    <!-- Éclat spéculaire ponctuel net -->
    <circle cx="145" cy="118" r="10" fill="#ffffff" opacity="0.95" />
    <circle cx="145" cy="118" r="24" fill="#ffffff" opacity="0.25" filter="url(#softBlur)" />
  </g>
</svg>
